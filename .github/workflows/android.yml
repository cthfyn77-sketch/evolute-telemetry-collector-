name: Android APK
on:
  push:
    branches: [ main, 'feature/**' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run JVM unit tests for both editions
        run: gradle :app:testStandardDebugUnitTest :app:testProDebugUnitTest
      - name: Build Standard and Pro APKs
        run: gradle assembleStandardDebug assembleProDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: evolute-telemetry-collector-0.3.0-apks
          path: |
            app/build/outputs/apk/standard/debug/*.apk
            app/build/outputs/apk/pro/debug/*.apk
          if-no-files-found: error
