name: Android tests and optional APK build

on:
  push:
    branches: [ main, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, 'feature/**' ]
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build APK only after explicit user approval"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate signing secrets and prepare keystore
        if: ${{ inputs.build_apk == true }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_KEYSTORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/evolute-release.jks"
          test -s "$RUNNER_TEMP/evolute-release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/evolute-release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_KEYSTORE_PASSWORD=$SIGNING_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/evolute-release.jks" -storepass "$SIGNING_KEYSTORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null
          echo "Keystore and alias validated; secret values were not printed."

      - name: Run JVM unit tests
        run: gradle testDebugUnitTest

      - name: Build signed release APK
        if: ${{ inputs.build_apk == true }}
        run: gradle assembleRelease

      - name: Verify APK signature and report certificate fingerprint
        if: ${{ inputs.build_apk == true }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          CERT_OUTPUT="$( "$APKSIGNER" verify --print-certs "$APK" 2>&1 )"
          printf '%s\n' "$CERT_OUTPUT"
          CERT_SHA256="$(printf '%s\n' "$CERT_OUTPUT" | sed -nE 's/.*SHA-256 digest: ([[:xdigit:]]{64}).*/\1/p' | head -n 1)"
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::Could not extract the APK signer SHA-256 certificate fingerprint."
            exit 1
          fi
          echo "APK signer certificate SHA-256: $CERT_SHA256"
          echo "Release APK signature verification passed."

      - name: Upload signed release APK
        if: ${{ inputs.build_apk == true }}
        uses: actions/upload-artifact@v4
        with:
          name: evolute-telemetry-collector-v158-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
